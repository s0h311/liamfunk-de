services:
  app:
    build:
      context: .
    environment:
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING}
      ENVIRONMENT: ${ENVIRONMENT}
      SERVER_HOST: ${SERVER_HOST}
      VITE_BASE_URL: ${VITE_BASE_URL}
    depends_on:
      postgres:
        condition: service_started
    networks:
      - liamfunk-de-network

volumes:
  liamfunk-de_postgres:
networks:
  liamfunk-de-network:
